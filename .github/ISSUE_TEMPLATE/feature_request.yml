name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        This project is an evidence-based reconstruction. Before requesting a
        feature, please read `PROVENANCE.md` and `docs/FAQ.md`. Suggested changes
        that invent product behavior without an artifact anchor may not be
        actionable here.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to achieve, and why are the current options insufficient?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed change
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: guidance
    attributes:
      label: Guidance
      description: Optional — which area does this touch (inference router, host, coordinator, editable frontend, packaging, docs)?